<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Rocco's Garage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --page-bg: #8fd4ff;
        --rack-bg: #ffb340;
        --rack-edge: #e08e1b;
      }
      @media (prefers-color-scheme: dark) {
        :root { --page-bg: #1d3a5f; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
        background: var(--page-bg);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .fly-tire {
        position: absolute;
        pointer-events: none;
        will-change: transform;
        z-index: 5;
      }
      .confetti {
        position: absolute;
        top: -20px;
        pointer-events: none;
        border-radius: 3px;
        z-index: 6;
      }
      .spark {
        position: absolute;
        pointer-events: none;
        z-index: 6;
        font-size: 26px;
        line-height: 1;
      }
      #yay {
        position: absolute;
        left: 50%;
        top: 34%;
        transform: translate(-50%, -50%) scale(0);
        z-index: 7;
        pointer-events: none;
        font-weight: 800;
        font-size: clamp(56px, 14vw, 130px);
        color: #ffcf3f;
        -webkit-text-stroke: 3px #e2571e;
        text-shadow: 0 6px 0 #e2571e, 0 12px 24px rgba(0,0,0,.25);
        letter-spacing: 2px;
      }
      /* Tire rack */
      #rack {
        flex: 0 0 auto;
        background: linear-gradient(180deg, var(--rack-bg), #ff9d1c);
        border-top: 6px solid var(--rack-edge);
        padding: 10px 8px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(6px, 1.8vw, 22px);
        box-shadow: 0 -6px 18px rgba(0,0,0,.18);
        z-index: 10;
      }
      .rack-btn {
        appearance: none;
        border: none;
        background: #fff7e8;
        border-radius: 50%;
        width: clamp(54px, 14.5vw, 118px);
        height: clamp(54px, 14.5vw, 118px);
        padding: 7px;
        cursor: pointer;
        box-shadow: 0 5px 0 #d98a16, 0 9px 16px rgba(0,0,0,.22);
        touch-action: none;
        position: relative;
      }
      .rack-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d98a16, 0 5px 10px rgba(0,0,0,.22); }
      .rack-btn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
      .rack-btn.empty-slot { opacity: .35; }
      /* SVG helpers */
      .tireG { transform-box: fill-box; transform-origin: center; }
      .spin { animation: spin .5s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hub-ring { animation: hubPulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes hubPulse { 0%,100% { transform: scale(1); opacity:.9; } 50% { transform: scale(1.18); opacity:.5; } }
      .wiggle-hint { animation: wiggleHint .7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes wiggleHint { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
      .cloud { animation: drift 26s linear infinite alternate; }
      @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(20px); } }
      /* Tuna + Halloween helpers */
      .tunaInner { transform-box: fill-box; transform-origin: 50% 92%; }
      .tuna-tail { transform-box: fill-box; transform-origin: 100% 90%; animation: wag .55s ease-in-out infinite alternate; }
      @keyframes wag { from { transform: rotate(-9deg); } to { transform: rotate(11deg); } }
      .pumpkinInner { transform-box: fill-box; transform-origin: 50% 100%; }
      .bat-sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 3.4s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
      .bat-bob { animation: bob 2.8s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-5px); } to { transform: translateY(6px); } }
      .wingL { transform-box: fill-box; transform-origin: 100% 60%; animation: flapL .45s ease-in-out infinite alternate; }
      .wingR { transform-box: fill-box; transform-origin: 0% 60%; animation: flapR .45s ease-in-out infinite alternate; }
      @keyframes flapL { from { transform: rotate(8deg); } to { transform: rotate(-16deg); } }
      @keyframes flapR { from { transform: rotate(-8deg); } to { transform: rotate(16deg); } }
      @media (prefers-reduced-motion: reduce) {
        .cloud, .hub-ring, .wiggle-hint, .tuna-tail, .bat-sway, .bat-bob, .wingL, .wingR { animation: none; }
      }
    </style>
  </head>

    <script>
      "use strict";
      var SVGNS = "http://www.w3.org/2000/svg";
      var scene = document.getElementById("scene");
      var stage = document.getElementById("stage");
      var fx = document.getElementById("fx");
      var carG = document.getElementById("carG");
      var hitsG = document.getElementById("hits");
      var beams = document.getElementById("beams");
      var rackEl = document.getElementById("rack");

      /* ---------------- Audio (all synthesized) ---------------- */
      var AC = null;
      function audio() {
        if (!AC) {
          try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
        }
        if (AC && AC.state === "suspended") AC.resume();
        return AC;
      }
      function tone(freq, dur, type, vol, delay, slideTo) {
        var ac = audio(); if (!ac) return;
        var t0 = ac.currentTime + (delay || 0);
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(ac.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
      }
      function noiseHit(dur, freq, vol, delay, q) {
        var ac = audio(); if (!ac) return;
        var t0 = ac.currentTime + (delay || 0);
        var len = Math.max(1, Math.floor(ac.sampleRate * dur));
        var buf = ac.createBuffer(1, len, ac.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        var src = ac.createBufferSource(); src.buffer = buf;
        var f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q || 1;
        var g = ac.createGain(); g.gain.value = vol;
        src.connect(f); f.connect(g); g.connect(ac.destination);
        src.start(t0);
      }
      function sndPop()    { tone(420, 0.14, "sine", 0.35, 0, 70); noiseHit(0.08, 900, 0.25); }
      function sndBoing()  { tone(160, 0.28, "sine", 0.22, 0, 520); }
      function sndRatchet(){ for (var i = 0; i < 3; i++) noiseHit(0.03, 2400, 0.3, i * 0.07, 4); tone(300, 0.08, "square", 0.06, 0.21); }
      function sndHonk()   { tone(392, 0.22, "square", 0.16); tone(494, 0.22, "square", 0.16); }
      function sndDing(f)  { tone(f || 1180, 0.35, "sine", 0.18); tone((f || 1180) * 1.5, 0.3, "sine", 0.08, 0.02); }
      function sndSparkle(){ tone(1560, 0.12, "triangle", 0.14); tone(2090, 0.16, "triangle", 0.12, 0.06); }
      function sndBark() {
        for (var i = 0; i < 2; i++) {
          tone(290, 0.11, "sawtooth", 0.16, i * 0.17, 130);
          noiseHit(0.07, 750, 0.22, i * 0.17, 1.1);
        }
        tone(660, 0.14, "triangle", 0.1, 0.36);
      }
      function sndCheer() {
        var notes = [523, 659, 784, 1047, 784, 1047];
        for (var i = 0; i < notes.length; i++) tone(notes[i], 0.22, "triangle", 0.22, i * 0.11);
        noiseHit(0.5, 5000, 0.06, 0.1, 0.7);
      }
      function sndVroom() {
        var ac = audio(); if (!ac) return;
        var t0 = ac.currentTime;
        var o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();

        var g = hub.tireG;
        var dir = hub.slot.x < 0 ? -1 : 1;
        var dx = dir * (120 + Math.random() * 90);
        if (g.animate) {
          var anim = g.animate([
            { transform: "translate(0px,0px) rotate(0deg) scale(1)", opacity: 1 },
            { transform: "translate(" + (dx * 0.5) + "px,-120px) rotate(" + (dir * 160) + "deg) scale(1.06)", opacity: 1, offset: 0.45 },
            { transform: "translate(" + dx + "px,190px) rotate(" + (dir * 320) + "deg) scale(0.95)", opacity: 1, offset: 0.75 },
            { transform: "translate(" + (dx * 1.25) + "px,330px) rotate(" + (dir * 420) + "deg) scale(0.9)", opacity: 0 }
          ], { duration: 620, easing: "cubic-bezier(.3,.6,.6,1)" });
          anim.onfinish = function () { g.style.display = "none"; };
        } else {
          g.style.display = "none";
        }
        setTimeout(function () { sndBoing(); }, 480);
        hub.ringG.style.display = "";
        sparkleAt(CAR_CX + hub.slot.x, hub.slot.y);
      }

      function wiggleHub(i) {
        var hub = hubs[i];
        if (hub.ringG.animate) {
          hub.ringG.animate([
            { transform: "rotate(0deg)" }, { transform: "rotate(-7deg)" },
            { transform: "rotate(7deg)" }, { transform: "rotate(0deg)" }
          ], { duration: 300 });
        }
      }

      function firstEmptyHub() {
        for (var i = 0; i < 4; i++) if (!hubs[i].occupied && !hubs[i].reserved) return i;
        return -1;
      }

      function placeTire(i, type) {
        var hub = hubs[i];
        hub.occupied = true;
        hub.type = type;
        hub.swapped = true;
        hub.ringG.style.display = "none";
        hub.tireG.innerHTML = tireInner(type, hub.slot.r) + (hub.slot.far ? '<circle r="' + hub.slot.r + '" fill="rgba(0,0,0,0.28)"/>' : "");
        hub.tireG.style.display = "";
        sndRatchet();
        if (hub.tireG.animate) {
          hub.tireG.animate([
            { transform: "scale(1.55)", opacity: 0.4 },
            { transform: "scale(0.88)", opacity: 1, offset: 0.55 },
            { transform: "scale(1.1)", offset: 0.78 },
            { transform: "scale(1)" }
          ], { duration: 420, easing: "ease-out" });
        }
        sparkleAt(CAR_CX + hub.slot.x, hub.slot.y);
        checkComplete();
      }

      function checkComplete() {
        for (var i = 0; i < 4; i++) {
          if (!hubs[i].occupied || !hubs[i].swapped) return;
        }
        celebrate();
      }

      function celebrate() {
        busy = true;
        sndHonk();
        setTimeout(sndHonk, 260);
        setTimeout(sndCheer, 420);
        flashLights();
        bounceBody();
        confetti();
        var yay = document.getElementById("yay");
        if (yay.animate) {
          yay.animate([
            { transform: "translate(-50%,-50%) scale(0) rotate(-14deg)", opacity: 0 },
            { transform: "translate(-50%,-50%) scale(1.15) rotate(3deg)", opacity: 1, offset: 0.45 },
            { transform: "translate(-50%,-50%) scale(1) rotate(0deg)", opacity: 1, offset: 0.7 },
            { transform: "translate(-50%,-50%) scale(1) rotate(0deg)", opacity: 1, offset: 0.88 },
            { transform: "translate(-50%,-50%) scale(0.6)", opacity: 0 }
          ], { duration: 1500, easing: "ease-out" });
        }
        setTimeout(driveOff, 1600);
      }

      function flashLights() {
        var n = 0;
        var iv = setInterval(function () {
          beams.setAttribute("opacity", n % 2 === 0 ? "1" : "0");
          n++;
          if (n > 5) { clearInterval(iv); beams.setAttribute("opacity", "0"); }
        }, 170);
      }

      function driveOff() {
        sndVroom();
        for (var i = 0; i < 4; i++) hubs[i].tireG.classList.add("spin");
        var body = document.getElementById("carBody");
        var startX = CAR_CX;
        if (body && body.animate) {
          var anim = body.animate([
            { transform: "translate(" + startX + "px,0px)" },
            { transform: "translate(" + (startX + 1050) + "px,0px)" }
          ], { duration: 1250, easing: "cubic-bezier(.5,0,.9,.4)" });
          anim.onfinish = nextCar;
        } else {
          setTimeout(nextCar, 600);
        }
        /* move hit targets away with the car */
        hitsG.style.display = "none";
      }

      function rollIn(body) {
        if (body && body.animate) {
          busy = true;
          var anim = body.animate([
            { transform: "translate(" + (CAR_CX - 1050) + "px,0px)" },
            { transform: "translate(" + (CAR_CX + 26) + "px,0px)", offset: 0.78 },
            { transform: "translate(" + (CAR_CX - 10) + "px,0px)", offset: 0.9 },
            { transform: "translate(" + CAR_CX + "px,0px)" }
          ], { duration: 1150, easing: "cubic-bezier(.2,.7,.3,1)" });
          sndVroom();
          anim.onfinish = function () { busy = false; startHint(); };
        } else {
          busy = false;
          startHint();
        }
      }

      function nextCar() {
        buildCar();
        hitsG.style.display = "";
        rollIn(document.getElementById("carBody"));
      }

      /* ---------------- Rack ---------------- */
      var dragState = null;
      function buildRack() {
        rackEl.innerHTML = "";
        TIRE_TYPES.forEach(function (type) {
          var btn = document.createElement("button");
          btn.className = "rack-btn";
          btn.setAttribute("aria-label", (TIRE_NAMES[type] || type) + " tire");
          btn.innerHTML = tireSVGString(type, 100);
          btn.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            audio();
            startDrag(e, type, btn);
          });
          /* Keyboard-triggered clicks have detail 0 (pointer clicks are >= 1
             and are already handled by the drag flow). */
          btn.addEventListener("click", function (e) {
            if (e.detail !== 0 || busy) return;
            audio(); stopHint();
            var t = firstEmptyHub();
            if (t < 0) { sndHonk(); bounceBody(); return; }
            var r = btn.getBoundingClientRect();
            var ghost = document.createElement("div");
            ghost.className = "fly-tire";
            ghost.innerHTML = tireSVGString(type, 104);
            stage.appendChild(ghost);
            moveGhost(ghost, r.left + r.width / 2, r.top + r.height / 2);
            flyToHub(ghost, t, type);
          });
          rackEl.appendChild(btn);
        });
      }

      function startDrag(e, type, btn) {
        stopHint();
        var ghost = document.createElement("div");
        ghost.className = "fly-tire";
        ghost.innerHTML = tireSVGString(type, 104);
        stage.appendChild(ghost);
        moveGhost(ghost, e.clientX, e.clientY);
        if (ghost.animate) {
          ghost.animate([{ transform: "translate(-50%,-50%) scale(.6)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 140 });
        }
        dragState = { type: type, ghost: ghost, startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY };
        sndSparkle();
      }
      function moveGhost(ghost, cx, cy) {
        var r = stage.getBoundingClientRect();
        ghost.style.left = (cx - r.left) + "px";
        ghost.style.top = (cy - r.top) + "px";
        ghost.style.transform = "translate(-50%,-50%)";
      }
      window.addEventListener("pointermove", function (e) {
        if (!dragState) return;
        dragState.x = e.clientX; dragState.y = e.clientY;
        moveGhost(dragState.ghost, e.clientX, e.clientY);
      });
      window.addEventListener("pointercancel", function () {
        if (!dragState) return;
        dragState.ghost.remove();
        dragState = null;
      });
      window.addEventListener("pointerup", function (e) {
        if (!dragState) return;
        var d = dragState; dragState = null;
        var moved = Math.hypot(e.clientX - d.startX, e.clientY - d.startY);
        /* dropped near an empty hub? */
        var target = -1;
        if (!busy) {
          var best = 110;
          for (var i = 0; i < 4; i++) {
            if (hubs[i].occupied || hubs[i].reserved) continue;
            var pt = hubScreenPos(i);
            var dist = Math.hypot(e.clientX - pt.x, e.clientY - pt.y);
            if (dist < best) { best = dist; target = i; }
          }
        }
        if (target < 0 && moved < 34 && !busy) target = firstEmptyHub();
        if (target >= 0) {
          flyToHub(d.ghost, target, d.type);
        } else {
          /* no spot: happy bounce and vanish */
          sndBoing();
          if (d.ghost.animate) {
            var a = d.ghost.animate([
              { transform: "translate(-50%,-50%) scale(1)" },
              { transform: "translate(-50%,-140%) scale(.4) rotate(120deg)", opacity: 0 }
            ], { duration: 260, easing: "ease-in" });
            a.onfinish = function () { d.ghost.remove(); };
          } else d.ghost.remove();
          if (!busy && firstEmptyHub() < 0) { /* car full but not finished can't happen; all occupied+unswapped -> honk hello */
            sndHonk(); bounceBody();
          }
        }
      });

      function hubScreenPos(i) {
        var hub = hubs[i];
        var pt = scene.createSVGPoint();
        pt.x = CAR_CX + hub.slot.x; pt.y = hub.slot.y;
        var m = scene.getScreenCTM();
        var p = pt.matrixTransform(m);
        return { x: p.x, y: p.y };
      }

      function flyToHub(ghost, hubIdx, type) {
        var hub = hubs[hubIdx];
        hub.reserved = true; /* claim the spot so rapid taps can't double-book it */
        var pt = hubScreenPos(hubIdx);
        var r = stage.getBoundingClientRect();
        var fromX = parseFloat(ghost.style.left), fromY = parseFloat(ghost.style.top);
        var toX = pt.x - r.left, toY = pt.y - r.top;
        var midX = (fromX + toX) / 2, midY = Math.min(fromY, toY) - 90;
        function land() {
          ghost.remove();
          hub.reserved = false;
          if (busy) return;
          if (!hub.occupied) placeTire(hubIdx, type);
          else { var alt = firstEmptyHub(); if (alt >= 0) placeTire(alt, type); }
        }
        if (ghost.animate) {
          var a = ghost.animate([
            { left: fromX + "px", top: fromY + "px", transform: "translate(-50%,-50%) scale(1) rotate(0deg)" },
            { left: midX + "px", top: midY + "px", transform: "translate(-50%,-50%) scale(1.12) rotate(140deg)", offset: 0.55 },
            { left: toX + "px", top: toY + "px", transform: "translate(-50%,-50%) scale(1) rotate(300deg)" }
          ], { duration: 380, easing: "ease-out" });
          a.onfinish = land;
        } else land();
      }

      /* ---------------- Delight taps ---------------- */
      function sparkleAt(sx, sy) {
        var r = stage.getBoundingClientRect();
        var pt = scene.createSVGPoint(); pt.x = sx; pt.y = sy;
        var p = pt.matrixTransform(scene.getScreenCTM());
        burst(p.x - r.left, p.y - r.top);
      }
      function burst(x, y) {
        var chars = ["✦", "★", "✦", "•"];
        var cols = ["#ffd93f", "#ef476f", "#3fa7d6", "#6bcb77", "#ff9f1c"];
        for (var i = 0; i < 7; i++) {
          var s = document.createElement("div");
          s.className = "spark";
          s.textContent = chars[i % chars.length];
          s.style.color = cols[i % cols.length];
          s.style.left = x + "px"; s.style.top = y + "px";
          fx.appendChild(s);
          var ang = (i / 7) * Math.PI * 2 + Math.random() * 0.5;
          var dist = 44 + Math.random() * 40;
          if (s.animate) {
            var a = s.animate([
              { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
              { transform: "translate(" + (Math.cos(ang) * dist - 13) + "px," + (Math.sin(ang) * dist - 13) + "px) scale(1.15)", opacity: 0 }
            ], { duration: 480 + Math.random() * 180, easing: "ease-out" });
            a.onfinish = (function (el) { return function () { el.remove(); }; })(s);
          } else setTimeout((function (el) { return function () { el.remove(); }; })(s), 500);
        }
      }
      function confetti() {
        var cols = ["#ef476f", "#ffd93f", "#3fa7d6", "#6bcb77", "#ff8c1a", "#7c4dbd"];
        var r = stage.getBoundingClientRect();
        for (var i = 0; i < 42; i++) {
          var c = document.createElement("div");
          c.className = "confetti";
          var sz = 8 + Math.random() * 9;
          c.style.width = sz + "px"; c.style.height = sz * (0.5 + Math.random()) + "px";
          c.style.background = cols[i % cols.length];
          c.style.left = (Math.random() * r.width) + "px";
          fx.appendChild(c);
          if (c.animate) {
            var fall = c.animate([
              { transform: "translateY(0) rotate(0deg)", opacity: 1 },
              { transform: "translateY(" + (r.height + 60) + "px) rotate(" + (360 + Math.random() * 500) + "deg)", opacity: 0.9 }
            ], { duration: 1500 + Math.random() * 1100, delay: Math.random() * 350, easing: "cubic-bezier(.2,.6,.6,1)" });
            fall.onfinish = (function (el) { return function () { el.remove(); }; })(c);
          } else setTimeout((function (el) { return function () { el.remove(); }; })(c), 2000);
        }
      }

      document.getElementById("sign").addEventListener("pointerdown", function (e) {
        e.preventDefault(); audio();
        sndDing(880); setTimeout(function () { sndDing(1320); }, 90);
        var sign = document.getElementById("sign");
        if (sign.animate) {
          sign.animate([
            { transform: "rotate(0deg)", transformOrigin: "450px 86px" },
            { transform: "rotate(-2.4deg)", transformOrigin: "450px 86px" },
            { transform: "rotate(2deg)", transformOrigin: "450px 86px" },
            { transform: "rotate(0deg)", transformOrigin: "450px 86px" }
          ], { duration: 450, easing: "ease-in-out" });
        }
        var bulbs = document.getElementById("bulbs");
        bulbs.setAttribute("fill", "#ff9f1c");
        setTimeout(function () { bulbs.setAttribute("fill", "#ffd93f"); }, 220);
        setTimeout(function () { bulbs.setAttribute("fill", "#ff9f1c"); }, 440);
        setTimeout(function () { bulbs.setAttribute("fill", "#ffd93f"); }, 660);
        var r = stage.getBoundingClientRect();
        burst(r.width / 2, 60);
      });
      document.getElementById("sun").addEventListener("pointerdown", function (e) {
        e.preventDefault(); audio(); sndSparkle();
        var sun = document.getElementById("sun");
        if (sun.animate) sun.animate([{ transform: "rotate(0deg)", transformOrigin: "806px 66px" }, { transform: "rotate(360deg)", transformOrigin: "806px 66px" }], { duration: 800, easing: "ease-out" });
      });
      document.getElementById("cone").addEventListener("pointerdown", function (e) {
        e.preventDefault(); audio(); sndBoing();
        var cone = document.getElementById("cone");
        if (cone.animate) cone.animate([
          { transform: "rotate(0deg)", transformOrigin: "94px 540px" },
          { transform: "rotate(-13deg)", transformOrigin: "94px 540px" },
          { transform: "rotate(10deg)", transformOrigin: "94px 540px" },
          { transform: "rotate(0deg)", transformOrigin: "94px 540px" }
        ], { duration: 420 });
      });
      /* Pumpkins: friendly jack-o'-lanterns that bounce and glow when tapped */
      var PUMPKIN_SPOTS = [
        { x: 150, y: 542, s: 1.1 },
        { x: 722, y: 542, s: 0.68 },
        { x: 766, y: 542, s: 0.95 },
        { x: 300, y: 86, s: 0.55 }
      ];
      function pumpkinArt() {
        return '<ellipse class="pglow" cx="0" cy="-22" rx="37" ry="31" fill="#ffca3a" opacity="0"/>' +
          '<ellipse cx="-15" cy="-21" rx="15" ry="20" fill="#f97d0e"/>' +
          '<ellipse cx="15" cy="-21" rx="15" ry="20" fill="#f97d0e"/>' +
          '<ellipse cx="0" cy="-22" rx="17" ry="22" fill="#ff8c1a"/>' +
          '<path d="M -8 -43 Q -10 -22 -8 -2" stroke="#e06f00" stroke-width="2.5" fill="none"/>' +
          '<path d="M 8 -43 Q 10 -22 8 -2" stroke="#e06f00" stroke-width="2.5" fill="none"/>' +
          '<path d="M -2 -43 C -3 -50 1 -54 7 -54 C 6 -49 4 -45 2 -42 Z" fill="#5e8c31"/>' +
          '<g class="pface" fill="#7a3c00"><circle cx="-7" cy="-27" r="3.2"/><circle cx="7" cy="-27" r="3.2"/></g>' +
          '<path class="psmile" d="M -8 -17 Q 0 -10 8 -17" stroke="#7a3c00" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
          '<rect x="-32" y="-56" width="64" height="58" fill="transparent"/>';
      }
      var pumpkinsG = document.getElementById("pumpkins");
      var pkHTML = "";
      PUMPKIN_SPOTS.forEach(function (p) {
        pkHTML += '<g class="pumpkin" data-cx="' + p.x + '" data-cy="' + p.y + '" transform="translate(' + p.x + ',' + p.y + ') scale(' + p.s + ')" style="cursor:pointer"><g class="pumpkinInner">' + pumpkinArt() + "</g></g>";
      });
      pumpkinsG.innerHTML = pkHTML;
      document.querySelectorAll(".pumpkin").forEach(function (pk) {
        pk.addEventListener("pointerdown", function (e) {
          e.preventDefault(); audio();
          sndDing(500 + Math.random() * 120);
          var inner = pk.querySelector(".pumpkinInner");
          if (inner && inner.animate) {
            inner.animate([
              { transform: "scale(1,1) rotate(0deg)" },
              { transform: "scale(1.14,0.82) rotate(-3deg)", offset: 0.3 },
              { transform: "scale(0.94,1.1) rotate(2deg)", offset: 0.6 },
              { transform: "scale(1,1) rotate(0deg)" }
            ], { duration: 480, easing: "ease-out" });
          }
          var glow = pk.querySelector(".pglow");
          var face = pk.querySelector(".pface");
          var smile = pk.querySelector(".psmile");
          if (glow) glow.setAttribute("opacity", "0.55");
          if (face) face.setAttribute("fill", "#ffd23f");
          if (smile) smile.setAttribute("stroke", "#ffd23f");
          setTimeout(function () {
            if (glow) glow.setAttribute("opacity", "0");
            if (face) face.setAttribute("fill", "#7a3c00");
            if (smile) smile.setAttribute("stroke", "#7a3c00");
          }, 900);
          sparkleAt(parseFloat(pk.getAttribute("data-cx")), parseFloat(pk.getAttribute("data-cy")) - 26);
        });
      });
      document.getElementById("pump").addEventListener("pointerdown", function (e) {
        e.preventDefault(); audio(); sndDing(660);
        var pump = document.getElementById("pump");
        if (pump.animate) pump.animate([
          { transform: "scale(1)", transformOrigin: "826px 540px" },
          { transform: "scale(1.07,0.93)", transformOrigin: "826px 540px" },
          { transform: "scale(1)", transformOrigin: "826px 540px" }
        ], { duration: 300 });
      });
      scene.addEventListener("pointerdown", function (e) {
        audio();
        var r = stage.getBoundingClientRect();
        if (Math.random() < 0.9) burst(e.clientX - r.left, e.clientY - r.top);
        tone(700 + Math.random() * 500, 0.1, "triangle", 0.06);
      });

      /* ---------------- Hint wiggle ---------------- */
      function startHint() {
        stopHint();
        hintTimer = setTimeout(function () {
          if (busy) return;
          for (var i = 0; i < 4; i++) {
            if (hubs[i].occupied) { hubs[i].tireG.classList.add("wiggle-hint"); break; }
          }
        }, 2600);
      }
      function stopHint() {
        if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
        for (var i = 0; i < hubs.length; i++) hubs[i].tireG.classList.remove("wiggle-hint");
      }

      /* ---------------- Go ---------------- */
      buildRack();
      buildCar();
      /* first car rolls in */
      rollIn(document.getElementById("carBody"));
    </script>
  </body>
</html>
